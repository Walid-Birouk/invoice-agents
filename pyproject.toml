[project]
name = "ap-agents"
version = "0.1.0"
description = "Multi-agent supplier invoice processing over MCP and A2A"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7",
    "pyyaml>=6",
    "openai>=1.40",   # OpenAI-compatible client: DeepSeek, Mistral, Qwen, vLLM...
    "mcp>=2.3,<3",
    "a2a-sdk[http-server]>=1.3,<2",
    "uvicorn>=0.30",
    "pypdf>=5",
    "reportlab>=4",   # only for scripts/make_demo_data.py
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/ap_agents"]
